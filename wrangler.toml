name = "ai-website-growth-audit-platform"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[ai]
binding = "AI"

# Set via `wrangler pages secret put PAGESPEED_API_KEY` (or the Cloudflare dashboard) in production.
