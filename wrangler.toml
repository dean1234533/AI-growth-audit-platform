name = "ai-website-growth-audit-platform"
# `main` is intentionally omitted here: @astrojs/cloudflare validates this file's existence
# at the START of `astro build`, before dist/server/entry.mjs has been produced, which would
# otherwise fail every build. It's passed explicitly to `wrangler deploy` instead (see the
# "deploy" script in package.json).
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "dist/client"
binding = "ASSETS"
html_handling = "drop-trailing-slash"

[ai]
binding = "AI"

# Daily sweep for automated website monitoring — the handler itself decides which sites are
# actually due a scan (daily/weekly/monthly) based on each website's nextScanDue field.
[triggers]
crons = ["0 6 * * *"]

# Set via `wrangler secret put PAGESPEED_API_KEY` (or the Cloudflare dashboard) in production.
# For local dev, put PAGESPEED_API_KEY=... in a .dev.vars file (gitignored).
[vars]
# PAGESPEED_API_KEY is intentionally left unset here — provide it as a secret, not a committed var.
# The VAPID public key is safe to expose (it's also baked into the client bundle at build time
# as PUBLIC_VAPID_KEY); the matching private key lives only in the VAPID_PRIVATE_KEY_JWK secret.
PUBLIC_VAPID_KEY = "BEJacEYCXkvDlw1OTLFiK0kadycJzZBz9qlJfi-YnEvw9WOmYc3FeHV1AOQ1qV9HI9SzePMX17h1ohXs0gDrNaQ"
