name = "ai-website-growth-audit-platform"
# `main` is intentionally omitted here: @astrojs/cloudflare validates this file's existence
# at the START of `astro build`, before dist/server/entry.mjs has been produced, which would
# otherwise fail every build. It's passed explicitly to `wrangler deploy` instead (see the
# "deploy" script in package.json).
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[routes]]
pattern = "app.dean-da-dev.co.uk"
custom_domain = true

[assets]
directory = "dist/client"
binding = "ASSETS"
html_handling = "drop-trailing-slash"
# Route assets through the Worker so the HTTP→HTTPS redirect and the same security headers
# apply to every path, including prerendered pages and static files.
run_worker_first = true

# Self-referential service binding — lets the audit scanner (fetchSite.ts) fetch this same
# Worker's own hostnames in-process (no network hop, no DNS, no edge routing), which avoids
# the Cloudflare self-loopback 522 a Worker's own `fetch()` can hit when calling its own zone.
# Only used when the audited URL's host is in SELF_HOSTNAMES below — every other target still
# goes through the normal public fetch path unchanged.
[[services]]
binding = "SELF"
service = "ai-website-growth-audit-platform"

[ai]
binding = "AI"

# Astro's built-in session support (used by the adapter regardless of whether this project's own
# code calls the session API directly) needs a KV namespace bound as "SESSION". Without an
# explicit id here, `wrangler dev --remote` fails outright ("SESSION bindings must have an 'id'
# field") on any environment that doesn't already have a stale auto-provisioned id cached in
# .wrangler — confirmed by reproducing the failure from a clean container. This is the real
# namespace created via `wrangler kv namespace create` during that verification, not a
# placeholder.
[[kv_namespaces]]
binding = "SESSION"
id = "9330e71cdca4451c81f1fddadced8db2"

# Real headless-browser rendering for the audit engine (src/server/lib/renderPage.ts) — Workers
# can't spawn a local Chromium, so this proxies to Cloudflare's managed Browser Rendering
# service. Available on Workers Free (10 min/day browser time, 3 concurrent, 60s timeout) —
# see src/server/lib/scanBudget.ts for the daily-budget guard that keeps usage under that cap.
[browser]
binding = "BROWSER"

# Daily sweep for automated website monitoring — the handler itself decides which sites are
# actually due a scan (daily/weekly/monthly) based on each website's nextScanDue field.
[triggers]
# Daily full scans (06:00 UTC) plus a 15-minute lightweight uptime/reachability pass for
# Pro/admin-owned monitored websites — see cron/runLightweightChecks.ts and access.ts's
# canUseInstantAlerts. The 15-min pass never touches Browser Rendering, so it's free regardless
# of scan volume — see cron/entry.ts's scheduled() handler for how the two are dispatched.
crons = ["0 6 * * *", "*/15 * * * *"]

# Set via `wrangler secret put PAGESPEED_API_KEY` (or the Cloudflare dashboard) in production.
# For local dev, put PAGESPEED_API_KEY=... in a .dev.vars file (gitignored).
[vars]
# PAGESPEED_API_KEY is intentionally left unset here — provide it as a secret, not a committed var.
# The VAPID public key is safe to expose (it's also baked into the client bundle at build time
# as PUBLIC_VAPID_KEY); the matching private key lives only in the VAPID_PRIVATE_KEY_JWK secret.
PUBLIC_VAPID_KEY = "BEJacEYCXkvDlw1OTLFiK0kadycJzZBz9qlJfi-YnEvw9WOmYc3FeHV1AOQ1qV9HI9SzePMX17h1ohXs0gDrNaQ"
# Stripe price for the Pro plan (£5/mo, live mode) — not sensitive, it's already visible in
# every Checkout URL. STRIPE_SECRET_KEY and STRIPE_WEBHOOK_SECRET are set as secrets instead.
STRIPE_PRO_PRICE_ID = "price_1TytrgCVEvtoR0jJPNKRfApS"
# Hostnames that resolve to THIS deployment — the scanner routes fetches to any of these
# through the SELF service binding above instead of the public network. Comma-separated;
# add more here (never in code) if another domain is ever hosted on this same Worker.
SELF_HOSTNAMES = "app.dean-da-dev.co.uk,ai-website-growth-audit-platform.deanburt1308.workers.dev"
